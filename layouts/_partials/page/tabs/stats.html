<div class="card node-stats h-100">
  <div class="card-body">
    <div class="card-title h4">{{ (i18n "stats") }}</div>
    <div class="row row-cols-1 row-cols-sm-2 g-2 align-items-center">
        {{ with (.WordCount) }}
          <div class="col">{{ (i18n "word_count") }}</div>
          <div class="col">
            <input type="text" id="node-meta-word-count" class="form-control" name="node-meta-word-count"
                   value="{{ . }}" aria-label="{{ (i18n "word_count") }}" readonly>
          </div>
        {{ end }}
        {{ with (.ReadingTime) }}
          <div class="col">{{ (i18n "reading_time") }}</div>
          <div class="col">
            <div class="input-group">
              <input type="text" id="node-meta-reading-time" class="form-control" name="node-meta-reading-time"
                     value="{{ . }}" aria-label="{{ (i18n "reading_time") }}" readonly>
              <span class="input-group-text">{{ (i18n "minutes") }}</span>
            </div>
          </div>
        {{ end }}
    </div>
  </div>
</div>
