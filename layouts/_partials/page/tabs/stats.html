<section class="card node-stats h-100">
  <div class="card-body">
    <h5 class="card-title">{{ (i18n "stats") }}</h5>
    <div class="row row-cols-1 row-cols-sm-2 g-2 align-items-center">
        {{ with (.WordCount) }}
          <div class="col">
            <label for="node-meta-word-count">{{ (i18n "word_count") }}</label>
          </div>
          <div class="col">
            <input type="text" id="node-meta-word-count" class="form-control" name="node-meta-word-count"
                   value="{{ . }}" readonly>
          </div>
        {{ end }}
        {{ with (.ReadingTime) }}
          <div class="col">
            <label for="node-meta-reading-time">{{ (i18n "reading_time") }}</label>
          </div>
          <div class="col">
            <div class="input-group">
              <input type="text" id="node-meta-reading-time" class="form-control" name="node-meta-reading-time"
                     value="{{ . }}" readonly>
              <span class="input-group-text">{{ (i18n "minutes") }}</span>
            </div>
          </div>
        {{ end }}
    </div>
  </div>
</section>
