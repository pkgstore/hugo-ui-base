{{ define "main" }}

    {{ $cfg := (index (site.Params.section) (.Section)) }}

    <div class="row row-cols-1 row-cols-xl-{{ (($cfg.grid.cols) | default 2) }} g-3">
        {{ range (.Paginator.Pages) }}
          <div class="col">
              {{ (.Render "view") }}
          </div>
        {{ end }}
    </div>

    {{ (partial "pagination" .) }}

{{ end }}
