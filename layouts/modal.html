{{ $id := (.File.UniqueID) }}

<div class="modal fade" id="{{ ($id) }}-modal" tabindex="-1"
     aria-labelledby="{{ ($id) }}-label" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-scrollable">
    <div class="modal-content shadow">
      <div class="modal-header">
        <h2 class="modal-title fs-5 text-truncate" id="{{ ($id) }}-label">
          <a href="{{ (.RelPermalink) }}">{{ (.Title) }}</a>
        </h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label='{{ (i18n "close") }}'></button>
      </div>
      <div class="modal-body">
        <div class="node-body">
            {{ (.Render "content") }}
        </div>
      </div>
      <div class="modal-footer">
        <ul class="list-inline text-center text-body-secondary small">
            {{ if (.Params.tags) }}
                {{ range (.GetTerms "tags") }}
                  <li class="list-inline-item">
                    <a href="{{ (.Permalink) }}">#{{ ((.Title) | lower) }}</a>
                  </li>
                {{ end }}
                <li class="list-inline-item">&bull;</li>
            {{ end }}
            {{ with (.Params.date) }}
              <li class="list-inline-item">
                <time datetime='{{ (.UTC.Format "2006-01-02T15:04:05Z07:00") }}' data-fn="date-local">
                    {{ (.UTC.Format "2006/01/02 15:04:05 MST") }}
                </time>
              </li>
            {{ end }}
        </ul>
      </div>
    </div>
  </div>
</div>
